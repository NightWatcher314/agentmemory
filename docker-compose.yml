services:
  agentmemory:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        III_VERSION: ${AGENTMEMORY_III_VERSION:-0.11.2}
        III_SDK_VERSION: ${III_SDK_VERSION:-0.11.2}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - ${AGENTMEMORY_BIND_IP:-192.168.35.100}:${AGENTMEMORY_PORT:-53117}:3111
      - ${AGENTMEMORY_BIND_IP:-192.168.35.100}:${AGENTMEMORY_STREAMS_PORT:-53118}:3112
      - ${AGENTMEMORY_BIND_IP:-192.168.35.100}:${AGENTMEMORY_VIEWER_PORT:-53119}:3113
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  agentmemory-data: null
networks: {}
